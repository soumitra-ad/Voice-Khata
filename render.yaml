# Render blueprint: https://render.com/docs/blueprint-spec
# Deploy with: Render dashboard -> New -> Blueprint -> pick this repo.
services:
  - type: web
    name: voice-khata
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24.22.0"
      # Mock mode is the safe default: the whole loop runs with no Gnani credentials.
      # Set this to "0" in the dashboard only after every GNANI_* value below is filled in.
      - key: MOCK_VOICE
        value: "1"
      - key: TTS_SCRIPT
        value: native
      # Ephemeral on the free plan. Attach a disk (paid) and point this at it to keep the ledger.
      - key: LEDGER_DB
        value: /tmp/khata.db
      # Required. 64 hex chars: node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
      # Left blank, the server generates an in-memory key and transcripts become unreadable after a restart.
      - key: TRANSCRIPT_KEY
        sync: false
      # ---- Live Gnani wiring (verified against the live API on 2026-11-13) ----
      # None of this is secret: it is the documented endpoint and event map. The ONLY value you must add is
      # GNANI_API_KEY below (from https://app.gnani.ai/voice). Then set MOCK_VOICE=0 to use it.
      - key: GNANI_AUTH_HEADER
        value: x-api-key-id
      - key: GNANI_AUTH_VALUE
        value: "{key}"
      - key: GNANI_LANG_MAP
        value: hi:hi-IN,mr:mr-IN,bn:bn-IN,en:en-IN
      - key: GNANI_STT_WS_URL
        value: wss://api.vachana.ai/stt/v3/stream
      - key: GNANI_STT_HEADERS
        value: '{"model":"prisma-v3.0","language_code":"{lang}","x-sample-rate":"16000","x-min-silence-ms":"2000","x-idle-timeout-sec":"900"}'
      - key: GNANI_STT_END_MESSAGE
        value: '{"type":"commit"}'
      - key: GNANI_STT_EVENT_FIELD
        value: type
      - key: GNANI_STT_TEXT_FIELD
        value: text
      - key: GNANI_STT_FINAL_EVENT
        value: transcript
      - key: GNANI_STT_SPEECH_EVENT
        value: speech_start
      - key: GNANI_STT_ERROR_EVENT
        value: error
      - key: GNANI_STT_FINAL_TIMEOUT_MS
        value: "2500"
      - key: GNANI_TTS_WS_URL
        value: wss://api.vachana.ai/api/v1/tts
      - key: GNANI_TTS_VOICE
        value: Shivani
      - key: GNANI_TTS_REQUEST_TEMPLATE
        value: '{"text":"{text}","voice":"{voice}","model":"timbre-v3.0","language":"{lang}","audio_config":{"sample_rate":16000,"num_channels":1,"sample_width":2,"encoding":"linear_pcm","container":"raw"}}'
      - key: GNANI_TTS_AUDIO_FIELD
        value: data.audio
      - key: GNANI_TTS_EVENT_FIELD
        value: type
      - key: GNANI_TTS_END_EVENT
        value: complete
      - key: GNANI_TTS_ERROR_EVENT
        value: error
      - key: GNANI_TTS_SAMPLE_RATE
        value: "16000"
      # The one secret. sync: false = Render asks for it and never stores it in this file.
      - key: GNANI_API_KEY
        sync: false
